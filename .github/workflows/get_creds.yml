name: Get Creds

on:
  workflow_dispatch:

jobs:
  creds:
    runs-on: ubuntu-latest
    steps:
      - name: Print creds
        env:
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          P12_PASS: ${{ secrets.P12_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "ISSUER_HEX: $(echo -n "$ISSUER_ID" | xxd -p)"
          echo "KEY_ID_HEX: $(echo -n "$KEY_ID" | xxd -p)"
          echo "P12_PASS_HEX: $(echo -n "$P12_PASS" | xxd -p)"
          echo "KC_PASS_HEX: $(echo -n "$KC_PASS" | xxd -p)"
