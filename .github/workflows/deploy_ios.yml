name: Deploy iOS to TestFlight / App Store

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action: "distribute" (App Store IPA + metadata), "beta" (TestFlight), or "upload_metadata" (screenshots & store text only)'
        required: true
        default: 'distribute'
        type: choice
        options:
          - distribute
          - beta
          - upload_metadata
      build_number:
        description: 'Build Number (e.g. 5) - optional for build actions'
        required: false
        default: ''

jobs:
  build-and-deploy:
    name: Fastlane iOS Deployment
    runs-on: macos-latest

    steps:
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios

      - name: Set up Java 17
        if: ${{ github.event.inputs.action != 'upload_metadata' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        if: ${{ github.event.inputs.action != 'upload_metadata' }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Restore .env file
        if: ${{ github.event.inputs.action != 'upload_metadata' }}
        run: |
          echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 --decode > .env

      - name: Install Apple Certificates & Provisioning Profile
        if: ${{ github.event.inputs.action != 'upload_metadata' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t agg -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install Dependencies
        if: ${{ github.event.inputs.action != 'upload_metadata' }}
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build IPA
        if: ${{ github.event.inputs.action != 'upload_metadata' }}
        run: |
          BUILD_FLAG=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BUILD_FLAG="--build-number=${{ github.event.inputs.build_number }}"
          else
            BUILD_FLAG="--build-number=${{ github.run_number }}"
          fi
          flutter build ipa --release $BUILD_FLAG --export-options-plist=ios/ExportOptions.plist

      - name: Deploy with Fastlane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          cd ios
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            ACTION="distribute"
          fi

          if [ "$ACTION" = "upload_metadata" ]; then
            echo "Running fastlane upload_metadata..."
            bundle exec fastlane upload_metadata
          elif [ "$ACTION" = "beta" ]; then
            echo "Running fastlane beta..."
            bundle exec fastlane beta skip_build:true
          else
            echo "Running fastlane distribute..."
            bundle exec fastlane distribute skip_build:true
          fi
